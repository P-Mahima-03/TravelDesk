spring.application.name=traveldesk
# Server Configuration
server.port=${SERVER_PORT:8080}

# Application Configuration
spring.application.name=traveldesk
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/traveldesk_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}